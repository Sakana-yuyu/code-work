# Code Work 桌面端（codework/ 子树，T3 Code 线）云上发布管线。
#
# 触发方式：
#   1. 推送 `desktop-v*.*.*` tag（例如 desktop-v0.0.39）→ 构建 + 自动发布 GitHub Release。
#   2. 手动 workflow_dispatch → 可只构建（publish=false，产物仅存 workflow artifact，用于演练）。
#
# tag 命名空间约定（重要）：根目录 build.yml 负责根目录 Wails"Cursor助手"线，监听 `v*`；
# 本文件监听 `desktop-v*`。两者互不匹配，绝不能用 `v*` tag 发布 codework 桌面端，
# 否则会同时触发两条产品线（2026-08-31 发错线事故的根源）。
#
# 当前范围：Windows x64 NSIS（与本地 `dist:desktop:win:x64` 等价，未签名）。
# 构建脚本自带产物校验（server.asar 结构、fff 原生库探针、sidecar 启动、资源监视器）。
# macOS/Linux 与 Azure Trusted Signing 需要时再按上游 codework/.github/workflows/release.yml 扩展。

name: Code Work Desktop Release

on:
  push:
    tags:
      - "desktop-v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（如 0.0.39）；留空则取 codework/apps/desktop/package.json 的 version"
        required: false
        type: string
      publish:
        description: "构建后发布 GitHub Release（否则仅保存 workflow artifact）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: codework

jobs:
  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # 稀疏检出跳过 codework/.repos/（vendored 参考仓库，构建不需要）。
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            version="${GITHUB_REF_NAME#desktop-v}"
          else
            version="${{ inputs.version }}"
            if [[ -z "$version" ]]; then
              version="$(node -p "require('./apps/desktop/package.json').version")"
            fi
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "非法版本号：$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=desktop-v$version" >> "$GITHUB_OUTPUT"

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          working-directory: codework
          node-version-file: codework/package.json
          cache: false

      - name: Resolve Windows package cache path
        id: package_cache_path
        shell: pwsh
        run: '"path=$(vp pm cache dir)" >> $env:GITHUB_OUTPUT'

      - name: Cache Windows packages
        uses: actions/cache@v6
        with:
          path: ${{ steps.package_cache_path.outputs.path }}
          key: desktop-release-pkgs-win-x64-v1-${{ hashFiles('codework/pnpm-lock.yaml') }}

      - name: Install desktop dependencies
        run: vp install --filter=@codework/desktop... --filter=codework... --filter=@codework/scripts...

      - name: Cache Electron runtime
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\electron\Cache
          key: desktop-release-electron-cache-v1

      - name: Cache resource monitor binary
        id: resource_monitor_cache
        uses: actions/cache@v6
        with:
          path: codework/native/resource-monitor/target/x86_64-pc-windows-msvc/release/codework-resource-monitor.exe
          key: resource-monitor-x86_64-pc-windows-msvc-v1-${{ hashFiles('codework/native/resource-monitor/Cargo.lock', 'codework/native/resource-monitor/Cargo.toml', 'codework/native/resource-monitor/src/**') }}

      - name: Setup Rust
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Spectre-mitigated MSVC libs
        if: steps.resource_monitor_cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Tools.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ steps.version.outputs.version }}"

      - name: Build desktop artifact
        run: |
          set -euo pipefail
          args=(
            --platform win
            --target nsis
            --arch x64
            --build-version "${{ steps.version.outputs.version }}"
            --verbose
          )
          vp run dist:desktop:artifact "${args[@]}"

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for pattern in release/*.exe release/*.blockmap release/*.yml; do
            cp $pattern release-publish/
          done
          count=$(ls release-publish | wc -l)
          if [[ "$count" -lt 3 ]]; then
            echo "release-publish 只有 $count 个文件，预期至少 exe/blockmap/latest.yml" >&2
            exit 1
          fi
          (cd release-publish && sha256sum -- * > SHA256SUMS.txt)
          ls -la release-publish

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Code-Work-${{ steps.version.outputs.version }}-win-x64
          path: codework/release-publish/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' || inputs.publish == true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Code Work ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: codework/release-publish/*
          fail_on_unmatched_files: true
          token: ${{ github.token }}
